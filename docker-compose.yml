# Local development stack: Postgres + API + frontend.
#
# This is for running the portal on a laptop. Production is RDS, ECS/EC2 and
# CloudFront — see infra/aws-setup.md.
#
#   cp .env.example .env      # fill in the Cognito values
#   docker compose up --build
#
# Auth still goes to the real Cognito user pool: there is no local substitute,
# so VITE_COGNITO_* and COGNITO_* must point at a real pool even here.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-gyftr_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      POSTGRES_DB: ${DB_NAME:-gyftr}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gyftr_admin} -d ${DB_NAME:-gyftr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gyftr}
      DB_USER: ${DB_USER:-gyftr_admin}
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_REGION: ${AWS_REGION:-ap-south-1}
      COMPANY_EMAIL_DOMAINS: ${COMPANY_EMAIL_DOMAINS:-gyftr.net,gyftr.com}
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time — `docker compose up --build` after changing these.
        VITE_API_URL: http://localhost:3001
        VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
