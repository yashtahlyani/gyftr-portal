# GyFTR Portal — local / single-host orchestration
# Frontend and backend are separate images with separate ports/URLs.
#
# Usage:
#   cp .env.example .env   # fill in values
#   docker compose up --build
#
# Frontend → https://portal.gyftr.net (local: http://localhost:7867)
# Backend  → https://backend-portal.gyftr.net (local: http://localhost:7878)

services:
  backend:
    platform: linux/arm64
    build:
      context: ./backend
    image: gyftr-portal-api
    container_name: gyftr-backend
    ports:
      - "7878:7878"
    env_file:
      - .env
    environment:
      PORT: 7878
      FRONTEND_URL: ${FRONTEND_URL:-https://portal.gyftr.net}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7878/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    platform: linux/arm64
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://backend-portal.gyftr.net}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
    image: gyftr-portal-frontend
    container_name: gyftr-frontend
    ports:
      - "7867:7867"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
