server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths are client-side routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames change on every build, so they can cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or users keep running the old bundle
  # after a deploy — which looks exactly like "the fix didn't work".
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
