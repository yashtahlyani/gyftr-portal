# AWS CodeBuild — build the frontend and publish it.
#
# Two ways to ship this, pick one in the CodeBuild project:
#   S3 + CloudFront  (current setup) — the `post_build` sync below
#   ECR + ECS        — build the Docker image instead; see the commented block
#
# Required environment variables (CodeBuild project → Environment):
#   VITE_API_URL, VITE_COGNITO_USER_POOL_ID, VITE_COGNITO_CLIENT_ID
#   S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#
# VITE_* values are baked in at build time. Changing one means rebuilding —
# restarting a container will not pick it up.

version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend
      - npm ci

  pre_build:
    commands:
      - echo "Building frontend against $VITE_API_URL"
      - |
        if [ -z "$VITE_API_URL" ] || [ -z "$VITE_COGNITO_USER_POOL_ID" ] || [ -z "$VITE_COGNITO_CLIENT_ID" ]; then
          echo "ERROR: VITE_API_URL / VITE_COGNITO_USER_POOL_ID / VITE_COGNITO_CLIENT_ID must be set."
          echo "Without them the bundle builds successfully but every login fails."
          exit 1
        fi

  build:
    commands:
      - npm run build

  post_build:
    commands:
      # Hashed assets first, long-lived. index.html last, never cached — so a
      # user can never get a new index.html pointing at assets not yet uploaded.
      - aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
      - aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --cache-control "no-store,must-revalidate"
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/index.html" "/"

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'

